<div class="auth-modal" id="modal-login" hidden>
	<div class="auth-modal__overlay" data-close></div>
	<div class="auth-modal__window">
		<button type="button" class="auth-modal__close" data-close aria-label="Закрыть">✕</button>
		<h2 class="auth-modal__title">Вход</h2>
		<form class="auth-modal__form" method="POST" action="/login">
			<label>
				Логин
				<input type="text" name="login" required>
			</label>
			<label>
				Пароль
				<input type="password" name="password" required>
			</label>
			<button type="submit" class="auth-modal__submit">Войти</button>
		</form>
		<p class="auth-modal__switch">
			Нет аккаунта? <a href="#" data-open="modal-register">Зарегистрироваться</a>
		</p>
	</div>
</div>
