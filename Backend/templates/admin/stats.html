{{define "title"}}Статистика — Админка{{end}}

{{define "content"}}
<h1 class="h3 mb-3">Статистика</h1>

<h2 class="h5 mb-2">Группировка по времени</h2>

<div class="card mb-3">
	<div class="card-body">
		<div class="row g-3">
			<div class="col-md-4">
				<label class="form-label">Группировка</label>
				<select class="form-select" id="filter-group">
					<option value="hour">По часам</option>
					<option value="day" selected>По дням</option>
					<option value="week">По неделям</option>
					<option value="month">По месяцам</option>
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label">Действие</label>
				<select class="form-select" id="filter-action">
					<option value="">Все действия</option>
					<option value="page_view">Просмотры страниц</option>
					<option value="login">Входы</option>
					<option value="logout">Выходы</option>
					<option value="register">Регистрации</option>
					<option value="profile_update">Обновления профиля</option>
					<option value="product_create">Создание товаров</option>
					<option value="product_update">Редактирование товаров</option>
					<option value="product_delete">Удаление товаров</option>
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label">Сортировка</label>
				<select class="form-select" id="filter-sort">
					<option value="period" selected>По периоду</option>
					<option value="count">По количеству</option>
				</select>
			</div>
		</div>
		<button type="button" class="btn btn-dark mt-3" id="btn-agg-apply">Показать</button>
	</div>
</div>

<p class="text-muted" id="agg-counter"></p>

<div class="table-responsive bg-white rounded shadow-sm mb-5">
	<table class="table table-hover align-middle mb-0">
		<thead class="table-light">
			<tr>
				<th>Период</th>
				<th style="width: 150px;">Количество</th>
			</tr>
		</thead>
		<tbody id="agg-tbody">
			<tr><td colspan="2" class="text-center text-muted py-4">Загрузка...</td></tr>
		</tbody>
	</table>
</div>

<h2 class="h5 mb-2">Журнал действий</h2>

<div class="card mb-3">
	<div class="card-body">
		<div class="row g-3">
			<div class="col-md-4">
				<label class="form-label">Действие</label>
				<select class="form-select" id="log-action">
					<option value="">Все действия</option>
					<option value="page_view">Просмотры страниц</option>
					<option value="login">Входы</option>
					<option value="logout">Выходы</option>
					<option value="register">Регистрации</option>
					<option value="profile_update">Обновления профиля</option>
					<option value="product_create">Создание товаров</option>
					<option value="product_update">Редактирование товаров</option>
					<option value="product_delete">Удаление товаров</option>
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label">Сортировка</label>
				<select class="form-select" id="log-sort">
					<option value="created_at" selected>По времени</option>
					<option value="action">По действию</option>
					<option value="user_id">По пользователю</option>
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label">Порядок</label>
				<select class="form-select" id="log-order">
					<option value="desc" selected>Убывание</option>
					<option value="asc">Возрастание</option>
				</select>
			</div>
		</div>
		<button type="button" class="btn btn-dark mt-3" id="btn-log-apply">Показать</button>
	</div>
</div>

<p class="text-muted" id="log-counter"></p>

<div class="table-responsive bg-white rounded shadow-sm">
	<table class="table table-hover table-sm align-middle mb-0">
		<thead class="table-light">
			<tr>
				<th style="width: 60px;">ID</th>
				<th style="width: 180px;">Время</th>
				<th style="width: 100px;">User ID</th>
				<th style="width: 150px;">Действие</th>
				<th>Цель</th>
				<th style="width: 130px;">IP</th>
			</tr>
		</thead>
		<tbody id="log-tbody">
			<tr><td colspan="6" class="text-center text-muted py-4">Загрузка...</td></tr>
		</tbody>
	</table>
</div>

<script src="/js/admin_stats.js" defer></script>
{{end}}
